<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <h2>StyleHub 👗</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="cart.html">🛒 Cart</a>
        </div>

    </nav>


    <!-- Checkout -->
    <section class="checkout-section">

        <h1>Checkout 🛍️</h1>

        <form id="checkout-form">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >


            <label>Address</label>

            <textarea
                id="address"
                placeholder="Enter your full address"
                required
            ></textarea>


            <label>City</label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >


            <label>PIN Code</label>

            <input
                type="text"
                id="pincode"
                placeholder="Enter PIN code"
                required
            >


            <label>Payment Method</label>

            <select id="payment">

                <option value="cod">
                    Cash on Delivery
                </option>

                <option value="upi">
                    UPI
                </option>

                <option value="card">
                    Credit / Debit Card
                </option>

            </select>


            <h2>
                Total: ₹<span id="checkout-total">0</span>
            </h2>


            <button type="submit">
                Place Order
            </button>

        </form>

    </section>


    <footer>

        <p>© 2026 StyleHub. All Rights Reserved.</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
