<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StyleHub - Fashion Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>StyleHub 👗</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Women</a>
            <a href="#">Men</a>
            <a href="#">Sale</a>
            <a href="#">🛒 Cart</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>Discover Your Style ✨</h1>

        <p>Trendy fashion at affordable prices</p>

        <button>Shop Now</button>

    </section>

    <!-- Categories -->
    <section class="categories">

        <h2>Shop By Category</h2>

        <div class="category-container">

            <div class="category">
                👗
                <h3>Women</h3>
            </div>

            <div class="category">
                👔
                <h3>Men</h3>
            </div>

            <div class="category">
                👟
                <h3>Shoes</h3>
            </div>

            <div class="category">
                👜
                <h3>Accessories</h3>
            </div>

        </div>

    </section>

    <!-- Trending Products -->
    <section class="products">

        <h2>Trending Products</h2>

        <div class="product-container">

            <div class="product">
                <div class="product-image">👗</div>
                <h3>Trendy Dress</h3>
                <p>₹799</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">👚</div>
                <h3>Stylish Top</h3>
                <p>₹499</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">👖</div>
                <h3>Classic Jeans</h3>
                <p>₹999</p>
                <button>Add to Cart</button>
            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>

        <p>© 2026 StyleHub. All Rights Reserved.</p>

    </footer>

</body>
</html>
